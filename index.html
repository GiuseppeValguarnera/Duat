(function () {

	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches;

	// Blocco 13: niente più scrollTo né resize ripetuti (sul PC facevano "salire e scendere" la
	// pagina): un solo ricalcolo, ritardato, e solo se la misura è cambiata davvero.
	let lastW = 0, lastH = 0, fitTimer = 0;
	const refit = () => {
		clearTimeout(fitTimer);
		fitTimer = setTimeout(() => {
			const w = window.innerWidth, h = window.innerHeight;
			if (w === lastW && h === lastH) return;
			lastW = w; lastH = h;
			window.dispatchEvent(new Event('resize'));
		}, 150);

	if (window.visualViewport) {

	window.addEventListener('load', () => { lastW = window.innerWidth; lastH = window.innerHeight; setTimeout(refit, 600); });

	const canvas = document.getElementById('canvas');
	canvas.tabIndex = 0;
	canvas.addEventListener('pointerdown', () => { if (document.activeElement !== canvas) canvas.focus({ preventScroll: true }); });
	const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
	const toggleFS = () => {
		if (ios) return;                          // iPhone e iPad: si usa l'icona della Home
		try {
			if (fsEl()) {

			} else {
				const el = document.documentElement;
				const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });

	const NO_SCROLL = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar', 'PageUp', 'PageDown', 'Home', 'End'];

// --- Diagnosi dei crash ------------------------------------------------------------------
// Il gioco scrive in localStorage 'duat_diag_live' gli ultimi eventi (scripts/diag.gd). Qui si
// segna se la pagina è aperta e visibile: se all'avvio risulta ancora aperta, l'ultima volta è
// morta senza chiudersi (crash, scheda chiusa dal sistema). Quel registro diventa 'duat_diag_last',
// che il gioco mostra nelle Opzioni come "Ultimo problema". Tutto dentro try/catch.
(function () {
	const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
	const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
	try {
		if (get('duat_alive') === '1') {
			const live = get('duat_diag_live');
			if (live) {
				let d = {};
				try { d = JSON.parse(live); } catch (e) {}
				d.err = get('duat_diag_err') || '';
				put('duat_diag_last', JSON.stringify(d));
			}
		}
		put('duat_diag_err', '');
		put('duat_alive', '1');
		document.addEventListener('visibilitychange', () => put('duat_alive', document.visibilityState === 'visible' ? '1' : '0'));
		window.addEventListener('pagehide', () => put('duat_alive', '0'));
		window.addEventListener('error', (e) => put('duat_diag_err', String(e.message || 'errore').slice(0, 160)));
		window.addEventListener('unhandledrejection', (e) => put('duat_diag_err', String((e.reason && e.reason.message) || e.reason || 'errore').slice(0, 160)));
		document.getElementById('canvas').addEventListener('webglcontextlost', () => put('duat_diag_err', 'contesto WebGL perso'));
	} catch (e) {}
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Errore sconosciuto.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('Al tuo browser mancano funzioni necessarie per il gioco:\n' + missing.join('\n'));

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
